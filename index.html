<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Professional Language Translator</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:'Poppins',sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#4facfe,#00f2fe);
      padding:20px;
    }

    .translator-container{
      width:100%;
      max-width:500px;
      background:#fff;
      border-radius:20px;
      padding:30px;
      box-shadow:0 10px 30px rgba(0,0,0,0.2);
    }

    .translator-container h2{
      text-align:center;
      color:#333;
      margin-bottom:25px;
      font-size:28px;
      font-weight:600;
    }

    .input-group{
      margin-bottom:18px;
    }

    textarea{
      width:100%;
      min-height:120px;
      border:2px solid #e0e0e0;
      border-radius:12px;
      padding:15px;
      font-size:16px;
      resize:none;
      outline:none;
      transition:0.3s;
    }

    textarea:focus{
      border-color:#4facfe;
      box-shadow:0 0 8px rgba(79,172,254,0.3);
    }

    select{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:2px solid #e0e0e0;
      font-size:16px;
      outline:none;
      cursor:pointer;
      transition:0.3s;
    }

    select:focus{
      border-color:#4facfe;
    }

    .buttons{
      display:flex;
      gap:12px;
      margin-top:18px;
    }

    button{
      flex:1;
      padding:14px;
      border:none;
      border-radius:12px;
      font-size:16px;
      font-weight:500;
      cursor:pointer;
      transition:0.3s;
    }

    .translate-btn{
      background:#4facfe;
      color:white;
    }

    .translate-btn:hover{
      background:#2196f3;
      transform:translateY(-2px);
    }

    .voice-btn{
      background:#00c853;
      color:white;
    }

    .voice-btn:hover{
      background:#00a844;
      transform:translateY(-2px);
    }

    .output-box{
      margin-top:20px;
      position:relative;
    }

    #outputText{
      background:#f7f9fc;
      color:#333;
    }

    .status{
      text-align:center;
      margin-top:15px;
      font-size:14px;
      color:#666;
    }

    .recording-dot{
      width:12px;
      height:12px;
      background:red;
      border-radius:50%;
      display:inline-block;
      margin-left:8px;
      visibility:hidden;
      animation:blink 1s infinite;
    }

    @keyframes blink{
      50%{
        opacity:0;
      }
    }

    @media(max-width:500px){
      .buttons{
        flex-direction:column;
      }
    }

  </style>
</head>
<body>

  <div class="translator-container">

    <h2>
      🌍 Language Translator
      <span class="recording-dot" id="recordDot"></span>
    </h2>

    <div class="input-group">
      <textarea 
        id="inputText" 
        placeholder="Type or speak your text here..."
      ></textarea>
    </div>

    <div class="input-group">
      <select id="language">
        <option value="es">🇪🇸 Spanish</option>
        <option value="fr">🇫🇷 French</option>
        <option value="de">🇩🇪 German</option>
        <option value="hi">🇮🇳 Hindi</option>
        <option value="te">🇮🇳 Telugu</option>
        <option value="ja">🇯🇵 Japanese</option>
        <option value="ko">🇰🇷 Korean</option>
      </select>
    </div>

    <div class="buttons">
      <button class="voice-btn" onclick="startVoice()">
        🎤 Voice Input
      </button>

      <button class="translate-btn" onclick="translateText()">
        🔄 Translate
      </button>
    </div>

    <div class="output-box">
      <textarea 
        id="outputText" 
        placeholder="Translated text will appear here..."
        readonly
      ></textarea>
    </div>

    <div class="status" id="statusText">
      Ready to translate
    </div>

  </div>

  <script>

    // Voice Recognition
   function startVoice() {

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Your browser does not support voice recognition.");

    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  // Start listening
  recognition.start();

  document.getElementById("recordDot").style.visibility = "visible";

  document.getElementById("statusText").innerText =
    "Listening... Speak now";

  // Success
  recognition.onresult = function(event) {

    const transcript =
      event.results[0][0].transcript;

    document.getElementById("inputText").value =
      transcript;

    document.getElementById("statusText").innerText =
      "Voice recognized successfully";
  };

  // Error Handling
  recognition.onerror = function(event) {

    console.log("Speech Error:", event.error);

    let errorMessage = "Voice recognition failed";

    switch(event.error) {

      case "not-allowed":
        errorMessage = "Microphone permission denied";
        break;

      case "no-speech":
        errorMessage = "No speech detected";
        break;

      case "audio-capture":
        errorMessage = "Microphone not found";
        break;

      case "network":
        errorMessage = "Internet connection required";
        break;
    }

    document.getElementById("statusText").innerText =
      errorMessage;
  };

  // Stop animation
  recognition.onend = function() {

    document.getElementById("recordDot").style.visibility =
      "hidden";
  };
}

    // Translation Function
    async function translateText() {

      const text =
        document.getElementById("inputText").value;

      const targetLang =
        document.getElementById("language").value;

      if(text.trim() === ""){
        alert("Please enter or speak text.");
        return;
      }

      document.getElementById("statusText").innerText =
        "Translating...";

      const url =
        `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|${targetLang}`;

      try {

        const response = await fetch(url);

        const data = await response.json();

        const translatedText =
          data.responseData.translatedText;

        document.getElementById("outputText").value =
          translatedText;

        document.getElementById("statusText").innerText =
          "Translation completed";

        // Voice Output
        const speech =
          new SpeechSynthesisUtterance(translatedText);

        speech.lang = targetLang;

        window.speechSynthesis.speak(speech);

      } catch(error){

        document.getElementById("statusText").innerText =
          "Translation failed";

        alert("Something went wrong.");
      }
    }

  </script>

</body>
</html>
